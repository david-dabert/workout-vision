name: CI

on:
  push:
    branches: [main, counter-core]
  pull_request:
    branches: [main, counter-core]

# The jobs read the code and upload their artifacts; the token can do nothing else (audit of 3 October).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The counting gates compare with the baselines the base branch holds, not those of the change itself, so a
      # change cannot pass by editing them (audit of 3 October): the pull request's base, or main's previous commit.
      - name: Baselines of the base branch
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then git fetch --depth=1 origin "$GITHUB_BASE_REF"; base=FETCH_HEAD; else base=HEAD^1; fi
          mkdir -p "$RUNNER_TEMP/base"
          for f in test/real-phone/accuracy/scoreboard-baseline.json test/real-phone/accuracy/public-baseline.json test/real-phone/synth/synth.txt; do
            git show "$base:$f" > "$RUNNER_TEMP/base/$(basename "$f")"
          done
      # R2: the counting regression gate on David's labelled sets. Fails when the exact count falls or
      # any set is off by 3 or more (test/real-phone/accuracy/scoreboard.test.ts).
      - run: SCOREBOARD_BASE="$RUNNER_TEMP/base/scoreboard-baseline.json" npm run scoreboard
      # The 894 public build sets (Countix): the same rule (test/real-phone/accuracy/public-scoreboard.test.ts).
      - run: PUBLIC_BASE="$RUNNER_TEMP/base/public-baseline.json" npm run scoreboard:public
      # The 96 synthetic sets (test/real-phone/synth/sets, rendered by run.mjs): the count may not lose an exact
      # set, and the range and phase errors may not grow (audit FINDING-021).
      - run: SYNTH_BASE="$RUNNER_TEMP/base/synth.txt" SYNTH_DIR=test/real-phone/synth/sets npx vitest run --no-cache test/real-phone/synth/analyse.test.ts
      - run: git diff --exit-code test/real-phone/synth/synth.txt
      - run: npm run build

  e2e:
    name: Browser tests (Chromium and WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright --version
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      # One worker, as the timing checks of the touch tests were measured.
      - run: npx playwright test --retries=0 --workers=1

  # The tour (PLAN.md, GROWTH, after step 1): every screen reached without a video, on the production
  # build, in WebKit with the iPhone profile, at 390x664, 390x745 and 375x548, and at 390x664 with
  # Reduce Motion and with the light appearance. Its own checks fail the job; its shots and each
  # setting's results.json (with the srcHash) are kept as the run's artifacts for five days, and the
  # results are printed in the log. The screens that need David's clips run on the Mac.
  tour:
    name: Tour (WebKit, iPhone profile, three sizes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run build
      - name: Serve the production build
        run: |
          npx vite preview --port 4175 --strictPort &
          npx --yes wait-on@8 http://127.0.0.1:4175/workout-vision/ --timeout 60000
      - name: Run the tour at every setting
        run: |
          status=0
          for cfg in "390 664 0 dark" "390 745 0 dark" "375 548 0 dark" "390 664 1 dark" "390 664 0 light"; do
            set -- $cfg
            dir="test/real-phone/tour-ci/$1x$2"
            if [ "$3" = 1 ]; then dir="$dir-reduce"; fi
            if [ "$4" = light ]; then dir="$dir-light"; fi
            WV_W=$1 WV_H=$2 WV_REDUCED=$3 WV_SCHEME=$4 WV_DIR="$dir" node test/real-phone/tour-ci/tour.mjs || status=1
          done
          exit $status
      - name: Keep "Filmer ma série" in view for every exercise
        if: always()
        # The two gated heights only: 548 px is recorded by a local run, never gated (David, 29 September: weigh every run's cost).
        run: WV_SIZES=390x664,390x745 node test/real-phone/tour-ci/film-button.mjs
      - name: Keep the shots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-${{ github.sha }}
          path: |
            test/real-phone/tour-ci/*/
            test/real-phone/tour-ci/film-button-after.txt
          retention-days: 5

  # The journey (test/real-phone/synth/smoke.mjs, STRICT): the production app driven end to end, in Chromium
  # with the iPhone profile, by synthetic sets whose count is known exactly (test/real-phone/synth/README.md):
  # the card, the film screen, the video, the analysis, the result, a correction typed or the count accepted,
  # the replay, the report and the history. It fails when the count differs from the video's truth, a screen
  # is not reached, the correction is not the count saved, or any fault is seen beyond the two known aborted
  # requests. The videos are rendered once and kept in the cache, keyed on the renderer and the body model;
  # no video is committed. The body model is three.js r170's Michelle.glb (MIT), checked by its SHA-256.
  journey:
    name: Journey (synthetic sets, production build)
    runs-on: ubuntu-latest
    env:
      SETS: ${{ github.workspace }}/.journey-sets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Restored and saved as two steps, so a render survives a journey that fails; the key holds the renderer,
      # its parameters (this file) and the locked versions of three.js and Chromium (package-lock.json).
      - name: Restore the rendered sets
        id: sets
        uses: actions/cache/restore@v4
        with:
          path: .journey-sets
          key: journey-sets-${{ hashFiles('test/real-phone/synth/synth.js', 'test/real-phone/synth/synth.html', 'test/real-phone/synth/run-video.mjs', '.github/workflows/ci.yml', 'package-lock.json') }}
      - name: Render the sets
        if: steps.sets.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p "$SETS"
          curl -sSfL -o "$SETS/Michelle.glb" https://raw.githubusercontent.com/mrdoob/three.js/r170/examples/models/gltf/Michelle.glb
          echo "7a87e15a99ccbc5e5877be66e1e4ecae0a581adcafa0cce1a5569f49909e968e  $SETS/Michelle.glb" | sha256sum -c -
          export SYNTH_MODEL="$SETS/Michelle.glb" FFMPEG="$(command -v ffmpeg)"
          node test/real-phone/synth/run-video.mjs "$SETS/lateral_raise_front_8.webm" '{"video":{"w":720,"h":1280,"fps":30},"id":"v1","exercise":"lateral_raise","view":0,"reps":8,"peakL":95,"peakR":80,"seed":7}'
          node test/real-phone/synth/run-video.mjs "$SETS/curl_side_6.webm" '{"video":{"w":720,"h":1280,"fps":30},"id":"v3","exercise":"bicep_curl","view":90,"reps":6,"peakL":130,"peakR":130,"seed":12}'
          node test/real-phone/synth/run-video.mjs "$SETS/chair_15.webm" '{"video":{"w":720,"h":1280,"fps":30},"id":"c2","exercise":"squat","view":90,"reps":15,"outSec":0.8,"backSec":0.8,"endRest":4,"peakL":95,"peakR":95,"seed":21,"seated":true,"endUp":true,"window":30}'
      - name: Keep the rendered sets
        if: steps.sets.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .journey-sets
          key: ${{ steps.sets.outputs.cache-primary-key }}
      - name: Lateral raise from the front, corrected by typing 12, the contribution kept
        run: STRICT=1 AXE=node_modules/axe-core/axe.min.js TYPE=12 CONTRIBUTE=1 SHOTS=journey/lateral-raise node test/real-phone/synth/smoke.mjs "$SETS/lateral_raise_front_8.webm" lateral_raise "Élévations latérales"
      - name: Curl from the side, the count accepted
        if: always()
        run: STRICT=1 AXE=node_modules/axe-core/axe.min.js SHOTS=journey/curl node test/real-phone/synth/smoke.mjs "$SETS/curl_side_6.webm" bicep_curl "Curl biceps"
      # The 30-second chair stand (fitness-tests.js): starts seated, 15 stands, the last ending standing at about
      # 30 s, as a test usually ends; the score is the protocol's (synth.js, window), chosen from its row.
      - name: Chair stand test, 15 in 30 s, the last ended standing
        if: always()
        run: STRICT=1 AXE=node_modules/axe-core/axe.min.js TEST=chair_stand_test SHOTS=journey/chair-stand node test/real-phone/synth/smoke.mjs "$SETS/chair_15.webm" chair_stand_test "-"
      - name: Keep the shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-${{ github.sha }}
          path: journey/
          retention-days: 5
