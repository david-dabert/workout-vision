name: Deploy to GitHub Pages

# Publication waits for the whole CI verdict on main: lint, types, tests, the browser tests in Chromium and
# WebKit, the iPhone tour and the synthetic journeys (ci.yml). On 2 October main was published at 20:52 and its
# WebKit tour failed at 21:02 (audit, FINDING-001). The commit published is the one CI passed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_FEEDBACK_URL: ${{ secrets.VITE_FEEDBACK_URL }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/offline.spec.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
