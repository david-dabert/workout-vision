name: Deploy to GitHub Pages

# Publication waits for the whole CI verdict on main: lint, types, tests, the browser tests in Chromium and
# WebKit, the iPhone tour and the synthetic journeys (ci.yml). On 2 October main was published at 20:52 and its
# WebKit tour failed at 21:02 (audit, FINDING-001). The commit published is the one CI passed, and it is main's
# tip: a deploy by hand, or a CI re-run of an older commit, publishes nothing else (third audit, C29, C30, C44).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# The build runs npm ci and the tests: it reads the code and nothing more. Only the deploy job may publish
# (audit of 3 October: a compromised dependency in the build could otherwise deploy the site).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Only main's tip, and only a commit CI passed (third audit, C29, C30, C44). A re-run of an older commit's CI
  # that now passes would otherwise publish that commit over a newer one: it is skipped, not failed, so a
  # superseded run does not show red (review of the fixes, 3 October). A deploy by hand of a commit CI did not
  # pass would otherwise publish it, as the WebKit tour showed on 2 October (FINDING-001): that one fails.
  gate:
    # A deploy by hand publishes main only, never another branch past the CI gate (R6).
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # Reads main's tip and CI's runs for the commit (actions: read); it cannot write anything.
    permissions:
      contents: read
      actions: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        name: Publish only main's tip, and only a commit CI passed (R6)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tip=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$SHA" != "$tip" ]; then
            echo "Commit $SHA is not main's tip ($tip): superseded, nothing is published."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = workflow_dispatch ]; then
            c=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&branch=main&event=push&status=completed" --jq '.workflow_runs[0].conclusion // "none"')
            if [ "$c" != success ]; then
              echo "CI's latest completed run for $SHA concluded '$c': a deploy by hand publishes only a commit CI passed."; exit 1
            fi
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # What the published build may do, set once for every step below (WP0.3, docs/SPEC-production.md):
    # - VITE_EVENTS_URL, the anonymous usage counts (src/lib/events.js), is pinned empty until David decides D6 and
    #   WP2.3 gives the counts their notice. To switch them on is this one line: VITE_EVENTS_URL: ${{ vars.VITE_EVENTS_URL }}
    #   (feedback-worker/README.md, Deploy); the check of dist/ below then allows that origin only.
    # - VITE_LIVE and VITE_CONTRIBUTE (src/lib/buildFlags.js) are left unset: no live counting until Phase 6 (WP6.5),
    #   contributions paused until Phase 2 (WP0.4). Each is switched on by VITE_LIVE: '1' or VITE_CONTRIBUTE: '1' here.
    env:
      VITE_EVENTS_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The anonymous usage counts go to the server the job's VITE_EVENTS_URL names, pinned empty above: the app sends
      # nothing and its page policy is unchanged. The flags of the job's env reach the build.
      - run: npm run build
      # Fails when dist/ holds any events URL while VITE_EVENTS_URL is pinned empty, the repository variable's value
      # included, set or not (scripts/check-dist-events.mjs); prints the length of VITE_EVENTS_URL, never its value.
      - name: No events URL in the published build (D6)
        env:
          EVENTS_URL_VAR: ${{ vars.VITE_EVENTS_URL }}
        run: node scripts/check-dist-events.mjs dist
      - run: npx playwright install --with-deps chromium
      # The spec loads this build online: given the same address, it aborts every usage count the build would send,
      # so test visits never land in the production counts (e2e/offline.spec.js; review finding N2).
      - run: npx playwright test e2e/offline.spec.js --retries=0
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
