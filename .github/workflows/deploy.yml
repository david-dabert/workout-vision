name: Deploy to GitHub Pages

# Publication waits for the whole CI verdict on main: lint, types, tests, the browser tests in Chromium and
# WebKit, the iPhone tour and the synthetic journeys (ci.yml). On 2 October main was published at 20:52 and its
# WebKit tour failed at 21:02 (audit, FINDING-001). The commit published is the one CI passed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# The build runs npm ci and the tests: it reads the code and nothing more. Only the deploy job may publish
# (audit of 3 October: a compromised dependency in the build could otherwise deploy the site).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A deploy by hand publishes main only, never another branch past the CI gate (R6).
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/offline.spec.js --retries=0
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
