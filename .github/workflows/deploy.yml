name: Deploy to GitHub Pages

# Publication waits for the whole CI verdict on main: lint, types, tests, the browser tests in Chromium and
# WebKit, the iPhone tour and the synthetic journeys (ci.yml). On 2 October main was published at 20:52 and its
# WebKit tour failed at 21:02 (audit, FINDING-001). The commit published is the one CI passed, and it is main's
# tip: a deploy by hand, or a CI re-run of an older commit, publishes nothing else (third audit, C29, C30, C44).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# The build runs npm ci and the tests: it reads the code and nothing more. Only the deploy job may publish
# (audit of 3 October: a compromised dependency in the build could otherwise deploy the site).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A deploy by hand publishes main only, never another branch past the CI gate (R6).
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # The first step reads CI's runs for the commit (actions: read); the job still cannot write anything.
    permissions:
      contents: read
      actions: read
    steps:
      # Only main's tip, and only a commit CI passed (third audit, C29, C30, C44). A re-run of an older commit's
      # CI that now passes would otherwise publish that commit over a newer one; a deploy by hand would otherwise
      # publish main's tip even when its CI failed, as the WebKit tour did on 2 October (FINDING-001). Either
      # case stops here, before anything is built, and the deploy job never runs.
      - name: Publish only main's tip, and only a commit CI passed (R6)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tip=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$SHA" != "$tip" ]; then
            echo "Commit $SHA is not main's tip ($tip): an older commit is never published over a newer one."; exit 1
          fi
          if [ "$EVENT" = workflow_dispatch ]; then
            c=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&branch=main&event=push&status=completed" --jq '.workflow_runs[0].conclusion // "none"')
            if [ "$c" != success ]; then
              echo "CI's latest completed run for $SHA concluded '$c': a deploy by hand publishes only a commit CI passed."; exit 1
            fi
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/offline.spec.js --retries=0
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
