name = "workout-vision-feedback"
main = "worker.js"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "workout-vision-feedback"
database_id = "" # Fill after: npx wrangler d1 create workout-vision-feedback

# Secrets, set with `npx wrangler secret put <NAME>`, never written here (README.md, Deploy):
#   STATS_TOKEN  reads /stats, /dashboard and /feedback (at least 16 characters)
#   RATE_SALT    salts the daily hash of the IP used only by the rate limit of /event

# Every minute, the scheduled handler (worker.js) deletes the usage rate limit's IP hashes older than the last
# minute, so none outlives three minutes, with or without traffic (README.md).
[triggers]
crons = ["* * * * *"]
