  </head>
  <body>
    <div id="root"></div>
    <script>
      // Force-migration: clear stale service worker and caches.
      // Runs BEFORE app JS loads. One-time: sets a version flag in localStorage.
      // Increment CACHE_VERSION on any deploy that needs to bust stale SWs.
      (function() {
        var CACHE_VERSION = 2;
        var key = 'wv_cache_v';
        var current = parseInt(localStorage.getItem(key) || '0', 10);
        if (current < CACHE_VERSION && 'serviceWorker' in navigator) {
          localStorage.setItem(key, String(CACHE_VERSION));
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            var p = regs.map(function(r) { return r.unregister(); });
            return Promise.all(p);
          }).then(function() {
            return caches.keys();
          }).then(function(keys) {
            // Keep mediapipe cache (large model files), clear everything else
            var p = keys.filter(function(k) { return k.indexOf('mediapipe') === -1; })
                        .map(function(k) { return caches.delete(k); });
            return Promise.all(p);
          }).then(function() {
            location.reload();
          }).catch(function() {
            location.reload();
          });
        }
      })();
    </script>
  </body>
