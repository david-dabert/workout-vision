<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- 'unsafe-eval' is needed: web-demuxer's loader evaluates code on this page; without it the WebCodecs path fails
         and decoding falls back to playback (tried 3 October: the journey's decoding failed under the stricter policy). -->
    <!-- The policy lets the page reach one outside origin, Open Food Facts, for the barcode lookup of the coach's office:
         the barcode alone is sent, when the coach taps Rechercher (src/lib/openFoodFacts.js; 14 October 2026). The
         events plugin (vite.config.js) edits the first source list of connections in this file: no other may come before. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' blob: https://world.openfoodfacts.org; img-src 'self' blob: data:; media-src 'self' blob:; worker-src 'self' blob:; child-src 'self' blob:; base-uri 'none'; object-src 'none'" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080706" />
    <meta name="color-scheme" content="dark" />
    <style>html,body{background:#080706!important;color-scheme:dark}</style>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <!-- The critical fonts, preloaded in <head> with crossorigin (Phase 5 of David's order of 6 November 2026, PLAN.md). -->
    <link rel="preload" as="font" type="font/woff2" href="/node_modules/@fontsource/geist/files/geist-latin-700-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2" crossorigin />
    <!-- boot.js in <head> sets language and error handlers synchronously before stylesheets block paint -->
    <script src="/boot.js"></script>
    <title>WorkoutVision</title>
    <meta name="description" content="Counts your repetitions from a video, on your phone. Test version." />
    <meta property="og:title" content="WorkoutVision" />
    <meta property="og:description" content="Counts your repetitions from a video, on your phone. Test version." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://david-dabert.github.io/workout-vision/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="WorkoutVision" />
    <meta name="twitter:description" content="Counts your repetitions from a video, on your phone. Test version." />
  </head>
  <body>
    <div id="root"><div id="wv-boot" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#080706;color:#EFE8DC;font:400 32px/1.1 'Instrument Serif',Georgia,serif;letter-spacing:-0.02em;">WorkoutVision</div></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="/cache-bust.js"></script>
  </body>
</html>
