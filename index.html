  <body>
    <div id="root"></div>
    <script>
      // Block app rendering until stale service workers and caches are fully purged.
      // Without this, an old SW intercepts the module fetch and serves cached JS.
      window.__swReady = (async function() {
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function(r) { return r.unregister(); }));
          }
          if ('caches' in window) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function(k) { return caches.delete(k); }));
          }
        } catch(e) {}
      })();
    </script>
  </body>
