<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <!-- The labelling queue (src/label/label.js): stock clips streamed from their source, never copied here. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' blob:; img-src 'self' data: https://images.pexels.com https://cdn.pixabay.com https://upload.wikimedia.org; media-src 'self' blob: https://videos.pexels.com https://cdn.pixabay.com https://upload.wikimedia.org; base-uri 'none'; object-src 'none'" />
  <title>Comptage des vidéos</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0b0a09; --fg: #efe8dc; --dim: #a8a093; --line: #2c2924; --gold: #e2b56b; --ink: #14110d; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; -webkit-text-size-adjust: 100%; }
    h1 { font-size: 1.15rem; font-weight: 600; }
    .bar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    .dim { color: var(--dim); font-size: 0.85rem; line-height: 1.45; }
    .q { font-size: 1.35rem; font-weight: 600; margin: 12px 0 8px; }
    video { width: 100%; max-height: 56svh; background: #000; border-radius: 12px; display: block; }
    .credit { margin: 6px 0 12px; font-size: 0.75rem; color: var(--dim); }
    .credit a { color: var(--dim); }
    button, select, input { font: inherit; }
    button { min-height: 48px; width: 100%; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--fg); font-weight: 600; padding: 12px; margin-top: 8px; }
    button.primary { background: var(--fg); color: var(--ink); border-color: var(--fg); }
    button.tap { min-height: 132px; font-size: 1.6rem; background: var(--gold); color: var(--ink); border: none; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
    button:disabled { opacity: 0.35; }
    .row { display: flex; gap: 8px; } .row button { flex: 1; }
    .count { font-size: 3.5rem; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; margin: 4px 0; }
    select, input { width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: #15130f; color: var(--fg); padding: 10px 12px; margin-top: 8px; }
    .msg { margin-top: 12px; padding: 12px; border-radius: 12px; background: #1a1712; }
    .hide { display: none; }
    /* Counting: the video and the tap button on one screen, so the eye stays on the body while the thumb taps. */
    .counting video { max-height: 40svh; }
    .counting .q { margin: 4px 0; font-size: 1.1rem; }
    .counting .count { font-size: 2.4rem; margin: 0; }
    .counting button.tap { min-height: 104px; }
    .counting .dim { font-size: 0.8rem; }
  </style>
</head>
<body>
  <main id="app"><p class="dim">Chargement…</p></main>
  <script type="module" src="/src/label/label.js"></script>
</body>
</html>
